        (function() {

                while(true) {

            for (let i = 0; i < 64; i++) {

                    setInterval(() => {
                        gl.clearColor(Math.random(), Math.random(), Math.random(), 1.0);
                        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
